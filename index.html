<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Veracruzano — Menú TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'Arial',sans-serif;
    background:#000;
    color:#f3e6d2;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:#000;
    opacity:0;transition:opacity .7s ease;pointer-events:none;
  }
  .screen.active{opacity:1;pointer-events:auto;}

  /* Header fijo con logo */
  header{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:center;gap:1.2vw;
    padding:2vh 2vw;
    background:linear-gradient(180deg, rgba(0,0,0,.75), transparent);
  }
  header .logo{
    height:clamp(36px,6vh,72px);width:auto;border-radius:50%;
    object-fit:contain;box-shadow:0 0 0 2px rgba(217,164,65,.6);
    background:#fff;
  }
  header .titulo{
    font-size:clamp(20px,3vw,44px);font-weight:900;letter-spacing:2px;
    text-transform:uppercase;color:#f3e6d2;
  }
  header .titulo span{color:#d9a441;}
  header .slogan{font-size:clamp(11px,1.2vw,18px);color:#e0c79a;font-style:italic;text-align:center;}

  /* Foto: ahora es 16:9 real, llena toda la pantalla */
  .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* Indicador de progreso */
  .barra{position:absolute;bottom:0;left:0;height:6px;width:0;background:#d9a441;z-index:20;}
</style>
</head>
<body>

<section class="screen active" id="screen">
  <header>
    <img class="logo" src="img/logo.png" alt="Café Veracruzano">
    <div>
      <div class="titulo">Café <span>Veracruzano</span></div>
      <div class="slogan">Son y sabor</div>
    </div>
  </header>
  <img class="foto" id="foto" src="" alt="">
  <div class="barra" id="barra"></div>
</section>

<script>
  // Fotos 16:9 (1920x1080) con nombre del platillo, SIN precios
  const platillos = [
    {img:'img/hotcakes-fresa-platano.jpg', nombre:'Hotcakes con fresa y plátano'},
    {img:'img/hotcakes-fruta.jpg',         nombre:'Hotcakes con fruta fresca'},
    {img:'img/hotcakes-fresas-flor.jpg',   nombre:'Hotcakes con fresas'},
    {img:'img/hotcakes-mantequilla.jpg',   nombre:'Hotcakes con mantequilla'},
    {img:'img/tamales-bandeja.jpg',        nombre:'Tamales veracruzanos'},
    {img:'img/tamales-hoja.jpg',           nombre:'Tamales en hoja de plátano'},
    {img:'img/desayuno-tamales.jpg',       nombre:'Desayuno tradicional'},
    {img:'img/torta-lomito.jpg',           nombre:'Torta de lomito'},
    {img:'img/tortas-cecina.jpg',          nombre:'Tortas de cecina'},
    {img:'img/tortas-chilaquiles.jpg',     nombre:'Tortas y chilaquiles'},
    {img:'img/sandwich-queso.jpg',         nombre:'Sándwich de carne con queso'},
    {img:'img/tacos.jpg',                  nombre:'Tacos de la casa'},
    {img:'img/tlayudas.jpg',               nombre:'Tlayudas / memelas'},
    {img:'img/omelette-cafe.jpg',          nombre:'Omelette del día'},
    {img:'img/omelette-roll.jpg',          nombre:'Omelette de espinaca'},
    {img:'img/capuchinos-tres.jpg',        nombre:'Capuchinos'},
    {img:'img/capuchinos-dos.jpg',         nombre:'Capuchino con canela'},
    {img:'img/cafe-helado-dos.jpg',        nombre:'Café helado'},
    {img:'img/cafe-helado-toast.jpg',      nombre:'Café helado'},
    {img:'img/malteadas-fresa.jpg',        nombre:'Malteadas de fresa'},
    {img:'img/brownie-helado.jpg',         nombre:'Brownie con helado'}
  ];

  const foto = document.getElementById('foto');
  const barra = document.getElementById('barra');
  const screen = document.getElementById('screen');
  let idx = 0;
  const DURACION = 6000; // ms por foto

  function mostrar(i){
    const p = platillos[i];
    screen.classList.remove('active');
    setTimeout(()=>{
      foto.src = p.img;
      screen.classList.add('active');
      barra.style.transition='none';
      barra.style.width='0';
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          barra.style.transition = 'width '+DURACION+'ms linear';
          barra.style.width = '100%';
        });
      });
    }, 650);
  }

  // Precarga todas las fotos para rotación sin saltos
  platillos.forEach(p=>{ const i=new Image(); i.src=p.img; });

  mostrar(0);
  setInterval(()=>{
    idx = (idx+1) % platillos.length;
    mostrar(idx);
  }, DURACION + 700);
</script>
</body>
</html>
