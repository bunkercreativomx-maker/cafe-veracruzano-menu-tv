<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Veracruzano — Menú TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'Arial',sans-serif;
    background:#120b06;
    color:#f3e6d2;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:
      radial-gradient(900px 400px at 85% -5%, rgba(217,164,65,.12), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(138,90,59,.18), transparent 60%),
      linear-gradient(160deg,#1a0f08,#0d0704);
    padding:2.5vh 3vw;
    opacity:0;transition:opacity .7s ease;pointer-events:none;
  }
  .screen.active{opacity:1;pointer-events:auto;}

  /* Header fijo */
  header{display:flex;align-items:center;justify-content:center;gap:1.5vw;padding-bottom:1.5vh;}
  header .logo{
    height:clamp(40px,7vh,80px);width:auto;
    border-radius:50%;object-fit:contain;
    box-shadow:0 0 0 2px rgba(217,164,65,.5);
  }
  header .titulo{
    font-size:clamp(22px,3.2vw,48px);font-weight:900;letter-spacing:2px;
    text-transform:uppercase;color:var(--crema,#f3e6d2);
  }
  header .titulo span{color:#d9a441;}
  header .slogan{font-size:clamp(12px,1.3vw,20px);color:#c9a87c;font-style:italic;}

  /* Zona de la foto: SIEMPRE completa, nunca recortada */
  .foto-zone{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  .foto-zone img{
    max-width:100%;max-height:100%;
    width:auto;height:auto;
    object-fit:contain;                 /* <-- clave: no recorta */
    border-radius:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
  }

  /* Nombre del platillo */
  .nombre{
    text-align:center;padding:1.5vh 0 0.5vh;
    font-size:clamp(20px,3vw,44px);font-weight:bold;color:#f3e6d2;
    text-transform:capitalize;
  }
  .pie{
    text-align:center;padding-top:0.5vh;
    font-size:clamp(12px,1.4vw,20px);color:#8a6a45;letter-spacing:1px;
  }

  /* Indicador de progreso */
  .barra{position:absolute;bottom:0;left:0;height:5px;width:0;background:#d9a441;}
</style>
</head>
<body>

<!-- Plantilla de pantalla: se rellena por JS -->
<section class="screen active" id="screen">
  <header>
    <img class="logo" src="img/logo.png" alt="Café Veracruzano">
    <div>
      <div class="titulo">Café <span>Veracruzano</span></div>
      <div class="slogan">Son y sabor</div>
    </div>
  </header>
  <div class="foto-zone"><img id="foto" src="" alt=""></div>
  <div class="nombre" id="nombre"></div>
  <div class="pie">— Café Veracruzano —</div>
  <div class="barra" id="barra"></div>
</section>

<script>
  // Lista de fotos: ruta y nombre del platillo (SIN precios)
  const platillos = [
    {img:'img/hotcakes-fresa-platano.jpg', nombre:'Hotcakes con fresa y plátano'},
    {img:'img/hotcakes-fruta.jpg',         nombre:'Hotcakes con fruta fresca'},
    {img:'img/hotcakes-fresas-flor.jpg',   nombre:'Hotcakes con fresas'},
    {img:'img/hotcakes-mantequilla.jpg',   nombre:'Hotcakes con mantequilla'},
    {img:'img/tamales-bandeja.jpg',        nombre:'Tamales veracruzanos'},
    {img:'img/tamales-hoja.jpg',           nombre:'Tamales en hoja de plátano'},
    {img:'img/desayuno-tamales.jpg',       nombre:'Desayuno tradicional'},
    {img:'img/torta-lomito.jpg',           nombre:'Torta de lomito'},
    {img:'img/tortas-cecina.jpg',          nombre:'Tortas de cecina'},
    {img:'img/tortas-chilaquiles.jpg',     nombre:'Tortas y chilaquiles'},
    {img:'img/sandwich-queso.jpg',         nombre:'Sándwich de carne con queso'},
    {img:'img/tacos.jpg',                  nombre:'Tacos de la casa'},
    {img:'img/tlayudas.jpg',               nombre:'Tlayudas / memelas'},
    {img:'img/omelette-cafe.jpg',          nombre:'Omelette del día'},
    {img:'img/omelette-roll.jpg',          nombre:'Omelette de espinaca'},
    {img:'img/capuchinos-tres.jpg',        nombre:'Capuchinos'},
    {img:'img/capuchinos-dos.jpg',         nombre:'Capuchino con canela'},
    {img:'img/cafe-helado-dos.jpg',        nombre:'Café helado'},
    {img:'img/cafe-helado-toast.jpg',      nombre:'Café helado'},
    {img:'img/malteadas-fresa.jpg',        nombre:'Malteadas de fresa'},
    {img:'img/brownie-helado.jpg',         nombre:'Brownie con helado'}
  ];

  const foto = document.getElementById('foto');
  const nombre = document.getElementById('nombre');
  const barra = document.getElementById('barra');
  const screen = document.getElementById('screen');
  let idx = 0;
  const DURACION = 6000; // ms por foto

  function mostrar(i){
    const p = platillos[i];
    screen.classList.remove('active');
    setTimeout(()=>{
      foto.src = p.img;
      nombre.textContent = p.nombre;
      screen.classList.add('active');
      barra.style.transition='none';
      barra.style.width='0';
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          barra.style.transition = 'width '+DURACION+'ms linear';
          barra.style.width = '100%';
        });
      });
    }, 650);
  }

  mostrar(0);
  setInterval(()=>{
    idx = (idx+1) % platillos.length;
    mostrar(idx);
  }, DURACION + 700);
</script>
</body>
</html>
