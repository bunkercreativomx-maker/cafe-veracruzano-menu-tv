<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Veracruzano — Menú TV</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'Arial',sans-serif;
    background:#000;
    color:#f3e6d2;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:#000;
    opacity:0;transition:opacity .7s ease;pointer-events:none;
  }
  .screen.active{opacity:1;pointer-events:auto;}

  /* Encabezado de marca: imagen del banner aprobado (logo + titulos) */
  .header-brand{
    position:absolute;top:0;left:0;right:0;z-index:10;
    width:100%;height:auto;
    display:block;
  }

  /* Foto: ahora es 16:9 real, llena toda la pantalla */
  .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* Indicador de progreso */
  .barra{position:absolute;bottom:0;left:0;height:6px;width:0;background:#d9a441;z-index:20;}
</style>
</head>
<body>

<section class="screen active" id="screen">
  <img class="header-brand" src="img/header.png" alt="Café Veracruzano - Son y sabor">
  <img class="foto" id="foto" src="" alt="">
  <div class="barra" id="barra"></div>
</section>

<script>
  // Fotos 16:9 (1920x1080) que rotan, SIN precios ni nombres
  const platillos = [
    'img/hotcakes-fresa-platano.jpg',
    'img/hotcakes-fruta.jpg',
    'img/hotcakes-fresas-flor.jpg',
    'img/hotcakes-mantequilla.jpg',
    'img/tamales-bandeja.jpg',
    'img/tamales-hoja.jpg',
    'img/desayuno-tamales.jpg',
    'img/torta-lomito.jpg',
    'img/tortas-cecina.jpg',
    'img/tortas-chilaquiles.jpg',
    'img/sandwich-queso.jpg',
    'img/tacos.jpg',
    'img/tlayudas.jpg',
    'img/omelette-cafe.jpg',
    'img/omelette-roll.jpg',
    'img/capuchinos-tres.jpg',
    'img/capuchinos-dos.jpg',
    'img/cafe-helado-dos.jpg',
    'img/cafe-helado-toast.jpg',
    'img/malteadas-fresa.jpg',
    'img/brownie-helado.jpg'
  ];

  const foto = document.getElementById('foto');
  const barra = document.getElementById('barra');
  const screen = document.getElementById('screen');
  let idx = 0;
  const DURACION = 6000; // ms por foto

  function mostrar(i){
    const p = platillos[i];
    screen.classList.remove('active');
    setTimeout(()=>{
      foto.src = p;
      screen.classList.add('active');
      barra.style.transition='none';
      barra.style.width='0';
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          barra.style.transition = 'width '+DURACION+'ms linear';
          barra.style.width = '100%';
        });
      });
    }, 650);
  }

  // Precarga todas las fotos para rotación sin saltos
  platillos.forEach(p=>{ const i=new Image(); i.src=p; });

  mostrar(0);
  setInterval(()=>{
    idx = (idx+1) % platillos.length;
    mostrar(idx);
  }, DURACION + 700);
</script>
</body>
</html>
